<html lang="en">
<head>

    <title>Document</title>
    <style>

       .container{

    }
    .bleft{
        position: absolute;
        bottom: 40px;
        right: 1300px;
        color: aquamarine;

        left: 460px;

    </style>
</head>

    <div class="container">
        <img src="urus.jpg" alt="image">

        <h3 class="center">Center</h3>

    </div>

</html>
